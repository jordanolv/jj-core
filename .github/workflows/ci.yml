name: 🚀 CI - JJ Core Build & Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Run Linter
        run: npm run lint --workspace apps/web || echo "Lint warnings ignored"

      - name: 🏗️ Build API
        run: npm run build --workspace apps/api

      - name: 🏗️ Build Web
        run: npm run build --workspace apps/web

      - name: ✅ Build Success
        run: echo "✨ Build completed successfully!"