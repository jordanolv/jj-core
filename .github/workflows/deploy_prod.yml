name: 🚀 Deploy JJ Hub PROD to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy via SSH
        run: |
          ssh -i ~/.ssh/vps_key \
              -o StrictHostKeyChecking=no \
              -p ${{ secrets.VPS_PORT }} \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "✅ Connected to VPS"

            echo "💾 Backup .env if it exists"
            mkdir -p ~/backups

            # Backup .env
            if [ -f ~/projects/jj-core/prod/.env ]; then
              cp ~/projects/jj-core/prod/.env ~/backups/jj-core.env
              echo "✅ .env backed up"
            fi

            mkdir -p ~/projects/jj-core/prod
            cd ~/projects/jj-core/prod

            if [ ! -d ".git" ]; then
              echo "📁 Initial clone"
              git clone -b main https://${{ secrets.GH_TOKEN }}@github.com/jordanolv/jj-core.git .
            else
              echo "📦 Git repo already present"
            fi

            echo "📥 Pull latest code"
            git config --global --add safe.directory ~/projects/jj-core/prod
            git fetch origin
            git reset --hard origin/main

            echo "🧹 Clean build directories"
            rm -rf apps/web/.output/
            rm -rf apps/web/.nuxt/
            rm -rf node_modules/

            git status

            echo "🔄 Restore .env"
            # Restore .env
            if [ -f ~/backups/jj-core.env ]; then
              cp ~/backups/jj-core.env ~/projects/jj-core/prod/.env
              echo "✅ .env restored"
            fi

            echo "🔧 Update permissions"
            chown -R ${{ secrets.VPS_USERNAME }}:${{ secrets.VPS_USERNAME }} ~/projects/jj-core/prod

            echo "📦 Install dependencies"
            cd ~/projects/jj-core/prod
            npm ci

            echo "🏗️ Build API"
            npm run build --workspace apps/api

            echo "🏗️ Build Web"
            npm run build --workspace apps/web

            echo "🔄 Stop existing PM2 processes"
            pm2 delete jj-hub-api || true
            pm2 delete jj-hub-web || true

            echo "🚀 Start Applications with PM2"
            pm2 start ecosystem.config.js

            pm2 save

            echo "✅ JJ Hub PROD deployment finished 🎉"
          EOF