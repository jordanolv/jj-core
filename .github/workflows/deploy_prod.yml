name: 🚀 Deploy JJ Core PROD to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy via SSH
        run: |
          ssh -i ~/.ssh/vps_key \
              -o StrictHostKeyChecking=no \
              -p ${{ secrets.VPS_PORT }} \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "✅ Connected to VPS"

            echo "💾 Backup .env and uploads if they exist"
            mkdir -p ~/backups

            # Backup .env
            if [ -f ~/projects/jj-core/prod/.env ]; then
              cp ~/projects/jj-core/prod/.env ~/backups/jj-core.env
              echo "✅ .env backed up"
            fi

            # Backup database
            if [ -f ~/projects/jj-core/prod/prisma/dev.db ]; then
              cp ~/projects/jj-core/prod/prisma/dev.db ~/backups/jj-core.db
              echo "✅ Database backed up"
            fi

            # Backup uploads
            if [ -d ~/projects/jj-core/prod/public/uploads ]; then
              rsync -a ~/projects/jj-core/prod/public/uploads/ ~/backups/uploads/
              echo "✅ Uploads backed up"
            fi

            mkdir -p ~/projects/jj-core/prod
            cd ~/projects/jj-core/prod

            if [ ! -d ".git" ]; then
              echo "📁 Initial clone"
              git clone -b main https://${{ secrets.GH_TOKEN }}@github.com/jordanolv/jj-core.git .
            else
              echo "📦 Git repo already present"
            fi

            echo "📥 Pull latest code"
            git config --global --add safe.directory ~/projects/jj-core/prod
            git fetch origin
            git reset --hard origin/main

            echo "🧹 Clean build directories"
            rm -rf .next/
            rm -rf node_modules/

            git status

            echo "🔄 Restore .env, database and uploads"
            # Restore .env
            if [ -f ~/backups/jj-core.env ]; then
              cp ~/backups/jj-core.env ~/projects/jj-core/prod/.env
              echo "✅ .env restored"
            fi

            # Restore database
            if [ -f ~/backups/jj-core.db ]; then
              mkdir -p ~/projects/jj-core/prod/prisma
              cp ~/backups/jj-core.db ~/projects/jj-core/prod/prisma/dev.db
              echo "✅ Database restored"
            fi

            # Restore uploads
            if [ -d ~/backups/uploads ]; then
              mkdir -p ~/projects/jj-core/prod/public/uploads
              rsync -a ~/backups/uploads/ ~/projects/jj-core/prod/public/uploads/
              echo "✅ Uploads restored"
            fi

            echo "🔧 Update permissions"
            chown -R ${{ secrets.VPS_USERNAME }}:${{ secrets.VPS_USERNAME }} ~/projects/jj-core/prod

            echo "📦 Install dependencies"
            cd ~/projects/jj-core/prod
            npm ci

            echo "🗄️ Generate Prisma Client"
            npx prisma generate

            echo "🏗️ Build Application"
            npm run build

            echo "🔄 Stop existing PM2 process"
            pm2 delete jj-core || true

            echo "🚀 Start Application with PM2 using ecosystem.config.js"
            pm2 start ecosystem.config.js

            pm2 save

            echo "✅ JJ Core PROD deployment finished 🎉"
          EOF